<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WiFi Sensing</title>
  <link rel="stylesheet" href="/static/style.css?v=21" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <h1>WiFi Sensing</h1>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="togCsi" checked /> Heat / motion</label>
      <label class="toggle"><input type="checkbox" id="togPhone" checked /> Devices</label>
      <label class="toggle"><input type="checkbox" id="togTop" checked /> Top-down</label>
      <button id="btnCalibrate">Calibrate</button>
      <button id="btnPanel">Tools</button>
      <button id="btnPresent" class="primary">Presenter</button>
      <button id="btnLobby">Lobby</button>
      <span id="modePill" class="pill">live</span>
    </div>
  </header>

  <div class="hud-strip" id="scorecard"></div>

  <main class="stage">
    <div id="room3d" class="room3d"></div>
  </main>

  <aside class="drawer" id="drawer">
    <section class="block" id="panelPhone">
      <header>
        <h2>Devices</h2>
        <span id="phoneMeta"></span>
      </header>
      <div id="phoneList" class="phone-list"></div>
      <div class="stats">
        <div><label>Motion</label><strong id="statMotion">—</strong></div>
        <div><label>Presence</label><strong id="statPresence">—</strong></div>
        <div><label>Packets</label><strong id="statPps">—</strong></div>
        <div><label>Near</label><strong id="statNear">—</strong></div>
      </div>
    </section>
    <section class="block">
      <p class="empty" style="padding:12px;line-height:1.45;color:#9ab">
        Two boards = one radio link. Place TX and RX on opposite sides of the
        seating so the path crosses where people move. Off-path corners stay quiet.
      </p>
    </section>
  </aside>

  <script type="module" src="/static/room3d.js?v=21"></script>
  <script type="module" src="/static/app.js?v=21"></script>
</body>
</html>
